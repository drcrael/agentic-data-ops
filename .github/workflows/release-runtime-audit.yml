name: Published release runtime audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.package }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-14]
        python: ['3.11', '3.14']
        package: [wheel, sdist]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Download exact public release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.2 --dir release-artifacts --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS.txt
      - name: Verify hashes and install published artifact
        env:
          AUDIT_PACKAGE: ${{ matrix.package }}
        run: python scripts/install_audit_artifact.py
      - run: python -m pip check
      - run: python scripts/generate_test_workbooks.py
      - name: Test installed release (not checkout source)
        run: python -I -m pytest --import-mode=importlib --cov=data_maturity --cov-report=term-missing --junitxml=output/tests.xml
      - name: Exercise complete CLI lifecycle
        run: python scripts/audit_release_cli.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: audit-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.package }}
          path: output/
  live-model:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NO_CLOUD: '1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_CONTEXT_LENGTH: '8192'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Download exact public release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v0.1.2 --dir release-artifacts --pattern '*.whl' --pattern '*.tar.gz' --pattern SHA256SUMS.txt
      - name: Verify hashes and install published wheel
        env:
          AUDIT_PACKAGE: wheel
        run: python scripts/install_audit_artifact.py
      - name: Install pinned Ollama runtime
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ollama"
          cd "$RUNNER_TEMP/ollama"
          curl -fL --retry 3 -O https://github.com/ollama/ollama/releases/download/v0.34.2/ollama-linux-amd64.tar.zst
          curl -fL --retry 3 -O https://github.com/ollama/ollama/releases/download/v0.34.2/sha256sum.txt
          grep ' ollama-linux-amd64.tar.zst$' sha256sum.txt | sha256sum -c -
          tar --zstd -xf ollama-linux-amd64.tar.zst
          echo "$RUNNER_TEMP/ollama/bin" >> "$GITHUB_PATH"
      - name: Start local model service
        shell: bash
        run: |
          mkdir -p output/live-model-audit
          ollama serve > output/live-model-audit/ollama.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:11434/api/version; then break; fi
            sleep 1
          done
          ollama pull qwen2.5:3b
      - name: Test both adapters with real inference
        run: python scripts/audit_live_models.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: live-model-audit
          path: output/
