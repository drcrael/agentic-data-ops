[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-maturity-agent"
version = "0.1.3"
description = "Evidence-backed, local-first DataOps assessment and maturation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "openpyxl>=3.1.5,<4", "polars>=1.30,<2", "PyYAML>=6.0.2,<7", "httpx>=0.28,<1", "typer>=0.16,<1", "regex>=2024.11.6"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12", "mypy>=1.15", "types-PyYAML", "types-openpyxl", "types-regex", "build"]

[project.scripts]
data-maturity = "data_maturity.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data_maturity = ["prompts/*.txt", "resources/*.yaml", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: deterministic unit tests", "integration: component integration", "acceptance: complete product workflows", "security: policy and trust boundaries", "regression: fixed ground truth", "performance: bounded large-input tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["data_maturity"]

[tool.coverage.report]
show_missing = true
fail_under = 80
